project:
  type: website
  output-dir: _site
  post-render: tools/post_render.py
  render:
    - index.qmd
    - 404.qmd
    - work/index.qmd
    - zh-tw/index.qmd
    - zh-tw/work/index.qmd
    - zh-cn/index.qmd
    - zh-cn/work/index.qmd
  resources:
    - assets/
    - favicon.ico
    - lab/
    - notes/
    - log/
    - statement/
    - p/
    - brief/
    - paper/
    - blog/
    - robots.txt
    - .well-known/
    - admin/
    - exams/
    - sitemap-extra.xml

website:
  description: "Niansia is an NYCU master's student exploring AI security, computer vision, reproducible research, and evidence-oriented tools."
  site-url: "https://niansia.com"
  image: "/assets/og/site-en.jpg"
  open-graph: true
  twitter-card: true
  search: false

format:
  html:
    theme: [cosmo, styles.scss]
    toc: false
    smooth-scroll: false
    link-external-newwindow: true
    # The pages are the terminal app, not Quarto documents: skip the scripts for heading anchors, code copy and hover
    # previews (clipboard, anchor, popper and tippy); tools/post_render.py trims the rest.
    anchor-sections: false
    code-copy: false
    footnotes-hover: false
    crossrefs-hover: false
    citations-hover: false
    include-in-header:
      - file: includes/site-jsonld.html
      - text: |
          <meta name="theme-color" content="#fbeff4">
          <script src="/assets/js/page-transition.js?v=3"></script>
          <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
          <link rel="icon" href="/assets/icons/favicon-32.png" type="image/png" sizes="32x32">
          <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
          <meta name="google" content="notranslate">
          <link rel="preconnect" href="https://fonts.googleapis.com">
