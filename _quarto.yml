project:
  type: website
  output-dir: _site

website:
  description: "Niansia is an NYCU master's student exploring AI security, computer vision, reproducible research, and evidence-oriented tools."
  site-url: "https://niansia.github.io"
  open-graph: true
  twitter-card: true
  search: false
  page-footer:
    left: "© 2026 Niansia"
    right: "Built with Quarto · [Source](https://github.com/niansia/niansia.github.io)"

format:
  html:
    theme: [cosmo, styles.scss]
    toc: false
    smooth-scroll: true
    link-external-newwindow: true
    include-in-header:
      text: |
        <meta name="theme-color" content="#101820">
        <script src="/assets/js/lab-terminal.js" defer></script>

execute:
  freeze: auto
