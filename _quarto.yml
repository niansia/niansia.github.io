project:
  type: website
  output-dir: _site
  resources:
    - assets/

website:
  description: "Niansia is an NYCU master's student exploring AI security, computer vision, reproducible research, and evidence-oriented tools."
  site-url: "https://niansia.github.io"
  open-graph: true
  twitter-card: true
  search: false

format:
  html:
    theme: [cosmo, styles.scss]
    toc: false
    smooth-scroll: false
    link-external-newwindow: true
    include-in-header:
      text: |
        <meta name="theme-color" content="#edf0f7">
        <meta name="google" content="notranslate">
        <script>try{document.documentElement.dataset.theme=localStorage.getItem("niansia-theme")||"light";}catch(e){}</script>
        <script src="/assets/js/portfolio-data.js" defer></script>
        <script src="/assets/js/terminal-copy.js" defer></script>
        <script src="/assets/js/lab-terminal.js?v=cursor-32" defer></script>

execute:
  freeze: auto
