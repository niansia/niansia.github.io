.gates li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:0 8px;margin:6px 0;font-size:12.5px;line-height:1.5;}
.gates{margin:0;padding:0;list-style:none;}
.gates i{font-style:normal;font-weight:800;}.gates .y{color:var(--ok);}.gates .n{color:var(--dim2);}

.truth div{padding:10px;border-radius:11px;background:#0b0d12;border:1px solid var(--line);}

.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin:0;font-size:12px;}
.kv dt{color:var(--dim);}.kv dd{margin:0;font-family:var(--mono);word-break:break-all;}
.parity{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:#5fd49a0f;border:1px solid #5fd49a40;font-size:12.5px;line-height:1.55;}

.parity b{font-family:var(--mono);}
.note{font-size:12px;line-height:1.6;color:var(--dim);}
.explain{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:22px;}
.explain .box p{margin:0;font-size:13px;line-height:1.7;color:#c5ccd8;}
.explain .box h3{color:var(--acc);}
footer{margin-top:26px;padding-top:16px;border-top:1px solid var(--line);font:500 11.5px var(--mono);color:var(--dim);line-height:1.8;}
footer a{color:var(--dim);text-decoration:underline;}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}
@media(max-width:1000px){.hero{grid-template-columns:1fr;}.grid{grid-template-columns:1fr;}.input{position:static;}.viewer{grid-template-columns:1fr;}.views{flex-direction:row;flex-wrap:wrap;}.views button{flex:1 1 140px;}.explain{grid-template-columns:1fr;}}

  $('#dice').addEventListener('click', () => { $('#seed').value = Math.floor(Math.random() * 100000); });
  const drop = $('#drop');
  const take = async file => { try { source = await readFile(file); drop.querySelector('b').textContent = file.name; if (ready) run(); } catch (err) { $('#inerr').innerHTML = `<div class="err">${esc(t.err + err.message)}</div>`; } };
  $('#file').addEventListener('change', e => { if (e.target.files[0]) take(e.target.files[0]); });
  ['dragenter', 'dragover'].forEach(k => drop.addEventListener(k, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(k => drop.addEventListener(k, e => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) take(f); });
  init().catch(e => { $('#result').innerHTML = `<div class="err">${esc(t.err + e.message)}</div>`; });
})();
</script>
<script defer src="/assets/js/site-stats.js?v=3"></script>
</body>
