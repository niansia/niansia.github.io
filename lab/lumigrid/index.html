<style>

.top{display:flex;align-items:center;gap:12px;font:500 12px 'JetBrains Mono',monospace;color:var(--dim);}

.top .sp{flex:1;}

.lede{max-width:760px;color:var(--dim);font-size:15px;line-height:1.75;margin:0 0 22px;}
.lede b{color:var(--ink);font-weight:600;}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start;}

.viewer{position:relative;border-radius:16px;overflow:hidden;background:#000;border:1px solid var(--line);aspect-ratio:3/2;touch-action:none;user-select:none;}
.viewer canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;}
#cv-before{clip-path:inset(0 50% 0 0);}
.handle{position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:#fff;box-shadow:0 0 14px #7cc4ffaa;pointer-events:none;}

.tagL,.tagR{position:absolute;top:12px;font:500 11px 'JetBrains Mono','Noto Sans TC',monospace;padding:5px 9px;border-radius:99px;background:#0b0e14cc;border:1px solid var(--line);pointer-events:none;}
.tagL{left:12px;}.tagR{right:12px;color:var(--blue);}
.drop{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;background:repeating-linear-gradient(135deg,#0b0e14 0 14px,#0d1118 14px 28px);color:var(--dim);font-size:14px;line-height:1.7;cursor:pointer;}
.drop b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px;}
.drop.over{outline:2px dashed var(--blue);outline-offset:-10px;}
.busy{position:absolute;inset:0;display:none;place-items:center;background:#07080bb3;backdrop-filter:blur(2px);font:500 13px 'JetBrains Mono','Noto Sans TC',monospace;color:var(--ink);}
.busy.on{display:grid;}
.busy .bar{width:220px;height:4px;border-radius:9px;background:#ffffff1a;margin-top:12px;overflow:hidden;}
.busy .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--amber));transition:width .2s;}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px;}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;}
.seg button{font:500 12px 'JetBrains Mono','Noto Sans TC',monospace;color:var(--dim);background:var(--panel);border:0;padding:8px 12px;cursor:pointer;}
.seg button[aria-pressed="true"]{color:#041018;background:var(--blue);}
.samples{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-top:14px;}
.samples button{flex:none;width:96px;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#000;cursor:pointer;position:relative;}

.samples button span{position:absolute;left:6px;bottom:4px;font:500 10px 'JetBrains Mono',monospace;color:#fff;text-shadow:0 1px 3px #000;}
.samples button[aria-pressed="true"]{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue);}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;}
.panel h2{margin:0 0 10px;font:600 13px 'JetBrains Mono','Noto Sans TC',monospace;color:var(--dim);letter-spacing:.02em;}

.log li{display:grid;grid-template-columns:16px 1fr auto;gap:8px;padding:7px 0;border-top:1px dashed #ffffff12;align-items:start;}
.log li:first-child{border-top:0;}

.log li.done i{background:var(--ok);}
.log li.err i{background:var(--bad);}
.log li small{display:block;color:var(--dim);font-size:11px;}
.log li em{font-style:normal;color:var(--blue);}
.total{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);display:flex;justify-content:space-between;font:600 13px 'JetBrains Mono',monospace;}
.heat{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:center;margin-top:14px;}
.heat canvas{width:120px;height:80px;border-radius:8px;border:1px solid var(--line);image-rendering:pixelated;background:#000;}
.heat p{margin:0;color:var(--dim);font-size:12px;line-height:1.6;}
.notes{margin-top:26px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;}
@media(max-width:860px){.notes{grid-template-columns:1fr;}}

.foot{margin-top:28px;font:400 12px 'JetBrains Mono','Noto Sans TC',monospace;color:var(--dim);display:flex;flex-wrap:wrap;gap:14px;}

/* ---------------- area resize (same as OpenCV INTER_AREA) for the 256² thumbnail ---------------- */

function thumbnail(rgba, W, H, n = 256) {
  const tx = areaTaps(W, n), ty = areaTaps(H, n), tmp = new Float32Array(H * n * 3), out = new Float32Array(3 * n * n);
  for (let y = 0; y < H; y++) for (let o = 0; o < n; o++) { const t = tx[o]; let r = 0, g = 0, b = 0; for (let k = 0; k < t.length; k += 2) { const p = (y * W + t[k]) * 4, w = t[k + 1]; r += rgba[p] * w; g += rgba[p + 1] * w; b += rgba[p + 2] * w; } const q2 = (y * n + o) * 3; tmp[q2] = r; tmp[q2 + 1] = g; tmp[q2 + 2] = b; }
  for (let o = 0; o < n; o++) { const t = ty[o]; for (let x = 0; x < n; x++) { let r = 0, g = 0, b = 0; for (let k = 0; k < t.length; k += 2) { const p = (t[k] * n + x) * 3, w = t[k + 1]; r += tmp[p] * w; g += tmp[p + 1] * w; b += tmp[p + 2] * w; } const i = o * n + x; out[i] = r / 255; out[n * n + i] = g / 255; out[2 * n * n + i] = b / 255; } }
  return out;
}

/* ---------------- WebGL2: guide network + trilinear slicing + curves + colour matrix, exact fp32 ---------------- */
function sliceGL(rgba, W, H, grid) {
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const gl = cv.getContext('webgl2', {antialias: false, premultipliedAlpha: false});
  if (!gl) throw new Error('WebGL2 is not available');
  const floatOut = !!gl.getExtension('EXT_color_buffer_float');
  const fetch9 = [...Array(9)].map((_, k) => `c[${k}] = trilerp(g${k}, x0, x1, tx);`).join('\n');
  const vs = `#version 300 es\nvoid main(){ vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2); gl_Position = vec4(p * 2. - 1., 0., 1.); }`;
  const fs = `#version 300 es
precision highp float; precision highp int; precision highp sampler3D;
uniform highp usampler2D img; uniform vec2 size;
${[...Array(9)].map((_, k) => `uniform sampler3D g${k};`).join('')}
uniform vec3 W1[16]; uniform float B1[16]; uniform float W2[16]; uniform float B2;
out vec4 o;
float erf_(float x){ float s = sign(x); x = abs(x); float t = 1. / (1. + .3275911 * x);
  float y = 1. - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - .284496736) * t + .254829592) * t * exp(-x * x); return s * y; }
vec4 trilerp(sampler3D g, ivec3 a, ivec3 b, vec3 t){
  vec4 c000 = texelFetch(g, ivec3(a.x, a.y, a.z), 0), c100 = texelFetch(g, ivec3(b.x, a.y, a.z), 0), c010 = texelFetch(g, ivec3(a.x, b.y, a.z), 0), c110 = texelFetch(g, ivec3(b.x, b.y, a.z), 0);
  vec4 c001 = texelFetch(g, ivec3(a.x, a.y, b.z), 0), c101 = texelFetch(g, ivec3(b.x, a.y, b.z), 0), c011 = texelFetch(g, ivec3(a.x, b.y, b.z), 0), c111 = texelFetch(g, ivec3(b.x, b.y, b.z), 0);
  return mix(mix(mix(c000, c100, t.x), mix(c010, c110, t.x), t.y), mix(mix(c001, c101, t.x), mix(c011, c111, t.x), t.y), t.z); }
void main(){
  ivec2 p = ivec2(gl_FragCoord.xy);
  vec3 x = vec3(texelFetch(img, p, 0).rgb) / 255.;
  float z = B2; for (int i = 0; i < 16; i++){ float h = dot(W1[i], x) + B1[i]; h = .5 * h * (1. + erf_(h * .70710678)); z += W2[i] * h; }
  z = 1. / (1. + exp(-z));
  vec3 f = clamp(vec3((vec2(p) + .5) / size * vec2(16.), z * 8.) - .5, vec3(0.), vec3(15., 15., 7.));
  ivec3 x0 = ivec3(floor(f)); ivec3 x1 = min(x0 + 1, ivec3(15, 15, 7)); vec3 tx = f - vec3(x0);
  vec4 c[9];
  ${fetch9}
  float v[36]; for (int k = 0; k < 9; k++){ v[4*k] = c[k].x; v[4*k+1] = c[k].y; v[4*k+2] = c[k].z; v[4*k+3] = c[k].w; }
  vec3 y = x;
  for (int k = 0; k < 8; k++){ vec3 a = tanh(vec3(v[3*k], v[3*k+1], v[3*k+2])); y = y + a * (y - y * y); }
  vec3 r;
  r.x = (v[24] + 1.) * y.x + v[25] * y.y + v[26] * y.z + v[27];
  r.y = v[28] * y.x + (v[29] + 1.) * y.y + v[30] * y.z + v[31];
  r.z = v[32] * y.x + v[33] * y.y + (v[34] + 1.) * y.z + v[35];
  o = vec4(${floatOut ? 'r' : 'clamp(r, 0., 1.)'}, 1.);
}`;
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
  const pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(pr);
  if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(pr));
  gl.useProgram(pr);
  const tex = (unit, target) => { const t = gl.createTexture(); gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(target, t); for (const pn of [gl.TEXTURE_MIN_FILTER, gl.TEXTURE_MAG_FILTER]) gl.texParameteri(target, pn, gl.NEAREST); return t; };
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
  tex(0, gl.TEXTURE_2D); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8UI, W, H, 0, gl.RGBA_INTEGER, gl.UNSIGNED_BYTE, rgba);
  gl.uniform1i(gl.getUniformLocation(pr, 'img'), 0); gl.uniform2f(gl.getUniformLocation(pr, 'size'), W, H);
  const cell = 16 * 16 * 8;
  for (let k = 0; k < 9; k++) {
    const d = new Float32Array(cell * 4);
    for (let c = 0; c < 4; c++) { const ch = grid.subarray((4 * k + c) * cell, (4 * k + c + 1) * cell); for (let i = 0; i < cell; i++) d[i * 4 + c] = ch[i]; }
    tex(1 + k, gl.TEXTURE_3D); gl.texImage3D(gl.TEXTURE_3D, 0, gl.RGBA32F, 16, 16, 8, 0, gl.RGBA, gl.FLOAT, d);
    gl.uniform1i(gl.getUniformLocation(pr, `g${k}`), 1 + k);
  }
  gl.uniform3fv(gl.getUniformLocation(pr, 'W1'), guideW.w1.flat()); gl.uniform1fv(gl.getUniformLocation(pr, 'B1'), guideW.b1);
  gl.uniform1fv(gl.getUniformLocation(pr, 'W2'), guideW.w2); gl.uniform1f(gl.getUniformLocation(pr, 'B2'), guideW.b2);
  const target = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, target);
  gl.texImage2D(gl.TEXTURE_2D, 0, floatOut ? gl.RGBA32F : gl.RGBA8, W, H, 0, gl.RGBA, floatOut ? gl.FLOAT : gl.UNSIGNED_BYTE, null);
  const fb = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, fb); gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, target, 0);
  gl.viewport(0, 0, W, H); gl.drawArrays(gl.TRIANGLES, 0, 3);
  let out;
  if (floatOut) { out = new Float32Array(W * H * 4); gl.readPixels(0, 0, W, H, gl.RGBA, gl.FLOAT, out); }
  else { const u = new Uint8Array(W * H * 4); gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, u); out = Float32Array.from(u, v => v / 255); }
  gl.getExtension('WEBGL_lose_context')?.loseContext();
  return out;   // RGBA, row 0 = top row of the image
}

/* ---------------- pipeline ---------------- */
let busyOn = false;
function busy(on, text = '', frac) { busyOn = on; $('busy').classList.toggle('on', on); if (text) $('busy-t').textContent = text; if (frac != null) $('busy-bar').style.width = `${Math.round(frac * 100)}%`; }
const clamp8 = v => v <= 0 ? 0 : v >= 1 ? 255 : Math.round(v * 255);
let last = null, mode = 'full';
async function loadPixels(src) {
  const t0 = performance.now();
  const bmp = await createImageBitmap(src, {imageOrientation: 'from-image'});
  const s = Math.min(1, 1024 / Math.max(bmp.width, bmp.height));
  const w0 = Math.max(8, Math.round(bmp.width * s)), h0 = Math.max(8, Math.round(bmp.height * s)), W = Math.floor(w0 / 8) * 8, H = Math.floor(h0 / 8) * 8;
  const img = s < 1 ? await createImageBitmap(bmp, {resizeWidth: w0, resizeHeight: h0, resizeQuality: 'high'}) : bmp;
  const c = new OffscreenCanvas(W, H), g = c.getContext('2d', {willReadFrequently: true}); g.drawImage(img, 0, 0);
  const data = g.getImageData(0, 0, W, H).data;
  return {data, W, H, ms: performance.now() - t0, resized: s < 1};
}
async function enhance(src, label) {
  $('err').classList.remove('on'); resetLog();
  try {
    await initRuntime();
    busy(true, C.running, .05);
    mark(0, 'run'); const px = await loadPixels(src); const {data, W, H} = px;
    mark(0, 'done', px.ms, `${W} × ${H}${px.resized ? ` · ${C.tooBig}` : ''}`);
    mark(1, 'run'); let t = performance.now(); const th = thumbnail(data, W, H); mark(1, 'done', performance.now() - t);
    busy(true, C.running, .2);
    mark(2, 'run'); t = performance.now();
    const grid = (await sessGrid.run({thumb: new ort.Tensor('float32', th, [1, 3, 256, 256])})).grid.data;
    mark(2, 'done', performance.now() - t, 'ONNX · WebAssembly');
    drawHeat(grid);
    mark(3, 'run'); t = performance.now(); const base = sliceGL(data, W, H, grid); mark(3, 'done', performance.now() - t, 'WebGL2 fragment shader · fp32');
    busy(true, C.running, .45);
    // refiner input: 8 channels [x, clamp(base), 0, 0] (ORT-Web's WebGPU Conv is wrong for 6 input channels; the padding has zero weights)
    const n = W * H, xb = new Float32Array(8 * n), gOut = new Uint8ClampedArray(n * 4);
    for (let i = 0; i < n; i++) for (let c = 0; c < 3; c++) { xb[c * n + i] = data[i * 4 + c] / 255; const b = Math.min(1, Math.max(0, base[i * 4 + c])); xb[(3 + c) * n + i] = b; gOut[i * 4 + c] = clamp8(b); }
    for (let i = 0; i < n; i++) gOut[i * 4 + 3] = 255;
    await new Promise(r => setTimeout(r, 30));
    mark(4, 'run'); t = performance.now();
    const out = (await sessRef.run({xb: new ort.Tensor('float32', xb, [1, 8, H, W])})).out;
    const od = out.getData ? await out.getData() : out.data;
    mark(4, 'done', performance.now() - t, `ONNX · ${backend === 'webgpu' ? 'WebGPU' : 'WebAssembly'}`);
    const fOut = new Uint8ClampedArray(n * 4);
    for (let i = 0; i < n; i++) { for (let c = 0; c < 3; c++) fOut[i * 4 + c] = clamp8(od[c * n + i]); fOut[i * 4 + 3] = 255; }
    const total = stepEl.reduce((s, li) => s + (parseFloat(li.querySelector('em').textContent) || 0), 0);
    $('total').textContent = `${total.toFixed(0)} ms`;
    last = {W, H, input: new ImageData(new Uint8ClampedArray(data), W, H), global: new ImageData(gOut, W, H), full: new ImageData(fOut, W, H), label};
    paint(); busy(false); $('save').disabled = false; $('drop').style.display = 'none';
    return last;
  } catch (e) { showErr(e); throw e; }
}
function paint() {
  if (!last) return;
  for (const [id, im] of [['cv-before', last.input], ['cv-after', last[mode]]]) { const c = $(id); c.width = last.W; c.height = last.H; c.getContext('2d').putImageData(im, 0, 0); }
  $('viewer').style.aspectRatio = `${last.W} / ${last.H}`;
  $('tagR').textContent = C.after[mode];
}
function drawHeat(grid) {
  const c = $('heat'), g = c.getContext('2d'), im = g.createImageData(16, 16), cell = 2048;
  const vals = new Float32Array(256);
  for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) { let s = 0; for (let ch = 0; ch < 24; ch++) for (let z = 0; z < 8; z++) s += Math.tanh(grid[ch * cell + z * 256 + y * 16 + x]); vals[y * 16 + x] = s / 192; }
  const lo = Math.min(...vals), hi = Math.max(...vals);
  vals.forEach((v, i) => { const k = (v - lo) / (hi - lo + 1e-6); im.data[i * 4] = 20 + 235 * Math.min(1, k * 1.6); im.data[i * 4 + 1] = 40 + 150 * k; im.data[i * 4 + 2] = 90 + 160 * (1 - k); im.data[i * 4 + 3] = 255; });
  g.putImageData(im, 0, 0);
}

/* ---------------- UI ---------------- */
function setSplit(f) { f = Math.min(1, Math.max(0, f)); $('cv-before').style.clipPath = `inset(0 ${100 - f * 100}% 0 0)`; $('handle').style.left = `${f * 100}%`; }
let dragging = false;
$('viewer').addEventListener('pointerdown', e => { if (!last) return; dragging = true; $('viewer').setPointerCapture(e.pointerId); move(e); });
$('viewer').addEventListener('pointermove', e => dragging && move(e));
$('viewer').addEventListener('pointerup', () => { dragging = false; });
function move(e) { const r = $('viewer').getBoundingClientRect(); setSplit((e.clientX - r.left) / r.width); }
setSplit(.5);
document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { mode = b.dataset.mode; document.querySelectorAll('[data-mode]').forEach(x => x.setAttribute('aria-pressed', String(x === b))); paint(); });
$('pick').onclick = () => $('file').click();
$('drop').onclick = () => $('file').click();
$('file').onchange = () => { const f = $('file').files[0]; if (f) { pressSample(null); enhance(f, f.name).catch(() => {}); } };
['dragenter', 'dragover'].forEach(ev => $('viewer').addEventListener(ev, e => { e.preventDefault(); $('drop').classList.add('over'); }));
['dragleave', 'drop'].forEach(ev => $('viewer').addEventListener(ev, e => { e.preventDefault(); $('drop').classList.remove('over'); }));
$('viewer').addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) { pressSample(null); enhance(f, f.name).catch(() => {}); } });
const pressSample = id => document.querySelectorAll('[data-sample]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.sample == id)));
async function runSample(id) { pressSample(id); const blob = await (await fetch(`/assets/lumigrid/demo/sample-${id}.jpg`)).blob(); return enhance(blob, `NTIRE 2025 #${id} · ${C.sample}`); }
$('samples').addEventListener('click', e => { const b = e.target.closest('[data-sample]'); if (b && !busyOn) runSample(b.dataset.sample).catch(() => {}); });
$('save').onclick = () => { if (!last) return; const c = document.createElement('canvas'); c.width = last.W; c.height = last.H; c.getContext('2d').putImageData(last[mode], 0, 0); c.toBlob(b => { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `lumigrid-${mode}.png`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }, 'image/png'); };
window.__lg = {runSample, get last() { return last; }, get backend() { return backend; }};
if (q.get('sample')) runSample(q.get('sample')).catch(() => {});
</script>
