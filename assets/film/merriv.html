<style>

/* Every shape in this film is data from one run of Merriv's ONNX quantization demo (assets/merriv/film.json, written by
   tools/merriv_film.py): the holdout digits, the FP16 weights, the inputs and activations each INT8 build really computes,
   the paired outcomes, the report statistics and identifiers, the bisect probes and `merriv mcr verify`. */
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';

import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

const $ = id => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const sm = x => x * x * (3 - 2 * x);
const ss = (t, a, b) => sm(seg(t, a, b));
const lerp = (a, b, k) => a + (b - a) * k;
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const q = new URLSearchParams(location.search), EMBED = q.get('embed') === '1', CLEAN = q.get('clean') === '1';
let L = q.get('lang') || (/^zh-(cn|sg)/i.test(navigator.language) ? 'zh-CN' : /^zh/i.test(navigator.language) ? 'zh-TW' : 'en');
if (!['en', 'zh-TW', 'zh-CN'].includes(L)) L = 'en';
const D = await fetch('/assets/merriv/film.json?v=1').then(r => r.json());

/* ---------------- data ---------------- */
const N = D.cases, B = D.builds, B1 = B[1], B2 = B[2];
const PIX = new Float32Array(N * 64); for (let i = 0; i < PIX.length; i++) PIX[i] = (D.digits.charCodeAt(i) - 97) / 16;
const HIGH = [...D.highmask].map(c => c === '1');
const dec16 = s => { const b = atob(s), a = new Int16Array(b.length / 2); for (let i = 0; i < a.length; i++) a[i] = (b.charCodeAt(2 * i) | (b.charCodeAt(2 * i + 1) << 8)) << 16 >> 16; return Float32Array.from(a, v => v / 100); };
const ACT2 = dec16(B2.hidden_linear);
const H = D.hero, HI = H.index, CEIL = B2.input_range[1];
const hv = p => PIX[HI * 64 + p];
const pp = x => (x * 100).toFixed(1), pct = x => (x * 100).toFixed(1);
const argmax = a => a.reduce((m, v, i) => v > a[m] ? i : m, 0);
const LOG0 = H.logits[B[0].id], LOG2 = H.logits[B2.id], PRED2 = argmax(LOG2);
const clippedHero = [...Array(64).keys()].filter(p => hv(p) > CEIL + 1e-6).length;
const ruleOf = (b, id) => b.rules.find(r => r.rule === id);
const R2o = ruleOf(B2, 'overall-quality'), R2h = ruleOf(B2, 'high-ink-quality'), R1o = ruleOf(B1, 'overall-quality'), R1h = ruleOf(B1, 'high-ink-quality');
const NUM = Object.fromEntries(D.numerical.map(r => [r.tensor, r]));
const COMMIT = D.source.commit.slice(0, 7), RT = B2.runtime;
const sh = id => id.replace('mcr:sha256:', 'sha256:').slice(0, 19) + '…';

/* ---------------- copy ---------------- */

    fixture: 'engineering fixture<small>×0.55 and ×0.50 are deliberate negative controls, not an estimate of real-world regressions</small>',
    clipField: `${pct(B2.clipped_pixels)}% of all holdout pixels are cut<small>high-ink ${pct(B2.clipped_pixels_high)}% · common ${pct(B2.clipped_pixels_common)}%: more ink, more damage</small>`,
    hist: `hidden_linear in build-02 · ${(N * 32).toLocaleString('en-US')} activations<small>${N} cases × 32 units, read back from the quantized graph</small>`,
    eq: `<i>q</i> = clamp(round(<i>x</i> / <i>s</i>) + <i>z</i>, −128, 127)<small><i>s</i> = ${B2.hidden_scale.toFixed(4)} (balanced ${B1.hidden_scale.toFixed(4)}) · <i>z</i> = ${B2.hidden_zero}</small>`,
