  AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = 0; master.connect(AC.destination);
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 700; lp.Q.value = 4; lp.connect(master);
  [55, 82.4, 110, 164.8, 220].forEach((fr, i) => { const o = AC.createOscillator(), g = AC.createGain(); o.type = i < 2 ? 'sawtooth' : 'sine'; o.frequency.value = fr; o.detune.value = (i - 2) * 7; g.gain.value = i < 2 ? .025 : .05; o.connect(g); g.connect(lp); o.start(); });
  const lfo = AC.createOscillator(), lg = AC.createGain(); lfo.frequency.value = .06; lg.gain.value = 450; lfo.connect(lg); lg.connect(lp.frequency); lfo.start();
  master.gain.linearRampToValueAtTime(.4, AC.currentTime + 2.5);
}
function chime(i) {
  if (!AC || !soundOn) return;
  const t0 = AC.currentTime;
  [0, .09].forEach((d, k) => { const o = AC.createOscillator(), g = AC.createGain(); o.type = 'triangle'; o.frequency.value = [659, 784, 880, 988, 1047, 1175, 1319, 1480, 1568][i] * (k ? 1.5 : 1);
    g.gain.setValueAtTime(0, t0 + d); g.gain.linearRampToValueAtTime(.08, t0 + d + .01); g.gain.exponentialRampToValueAtTime(.0001, t0 + d + 1.2); o.connect(g); g.connect(master); o.start(t0 + d); o.stop(t0 + d + 1.3); });
}
function toggleSound() {
  soundOn = !soundOn; $('snd').textContent = C.snd[soundOn ? 1 : 0];
  if (soundOn) { if (!AC) startAudio(); else { AC.resume(); master.gain.linearRampToValueAtTime(.4, AC.currentTime + .5); } }
  else if (AC) master.gain.linearRampToValueAtTime(0, AC.currentTime + .4);
}

/* ---------------- UI ---------------- */
function applyLang() {
  C = COPY[L]; document.documentElement.lang = L === 'en' ? 'en' : L === 'zh-CN' ? 'zh-Hans' : 'zh-Hant';
  const base = L === 'en' ? '/' : L === 'zh-CN' ? '/zh-cn/' : '/zh-tw/';
  $('back').href = $('home').href = `${base}#research`; $('home').textContent = C.home;
  $('go-label').textContent = C.go; $('go-sub').textContent = C.goSub; $('snd').textContent = C.snd[soundOn ? 1 : 0];
  $('lang').textContent = {en: 'EN', 'zh-TW': '繁', 'zh-CN': '简'}[L];
  $('track').querySelectorAll('.tick').forEach(e => e.remove());
  START.forEach((s, i) => { if (!i) return; const tk = document.createElement('div'); tk.className = 'tick'; tk.style.left = `${s / TOTAL * 100}%`; tk.innerHTML = `<span>${C.chapters[i]}</span>`; tk.addEventListener('click', e => { e.stopPropagation(); seek(s + .01); }); $('track').append(tk); });
  shown = -1; codeFor = -1;
}
$('go').addEventListener('click', () => play(true));
$('play').addEventListener('click', () => play());
$('replay').addEventListener('click', () => { seek(0); play(true); });
$('track').addEventListener('click', e => { const r = e.currentTarget.getBoundingClientRect(); seek((e.clientX - r.left) / r.width * TOTAL); });
$('lang').addEventListener('click', () => { const next = {en: 'zh-TW', 'zh-TW': 'zh-CN', 'zh-CN': 'en'}[L]; const p = new URLSearchParams(q); p.set('lang', next); p.set('t', time.toFixed(1)); p.set('autoplay', playing ? '1' : '0'); location.replace(`?${p}`); });
$('snd').addEventListener('click', toggleSound);
$('fs').addEventListener('click', () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.());
canvas.addEventListener('click', () => { if (document.body.classList.contains('mini')) play(); });
addEventListener('keydown', e => {
  if (e.key === ' ') { e.preventDefault(); play(); }
  else if (e.key === 'ArrowRight') seek(time + 5); else if (e.key === 'ArrowLeft') seek(time - 5);
  else if (e.key.toLowerCase() === 'f') $('fs').click(); else if (e.key.toLowerCase() === 'r') { seek(0); play(true); }
  else if (e.key === 'Escape' && EMBED) parent.postMessage({source: 'propaganda-film', type: 'escape'}, '*');
});
addEventListener('pointermove', () => { document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => playing && document.body.classList.add('idle'), 2600); });
addEventListener('resize', () => { clearTimeout(resize.t); resize.t = setTimeout(resize, 120); });
addEventListener('message', e => { const m = e.data; if (!m || m.source !== 'niansia-dock') return; if (m.type === 'mode') { document.body.classList.toggle('mini', !!m.mini); resize(); } if (m.type === 'play') play(true); if (m.type === 'pause') play(false); });
window.__film = {seek, play, get time() { return time; }, TOTAL};

if (EMBED) document.body.classList.add('embed');
if (q.get('clean') === '1') { $('ui').style.display = 'none'; lens.uniforms.uGrain.value = 0; } // recording mode
resize(); applyLang(); buildShapes();
(document.fonts?.ready || Promise.resolve()).then(() => buildShapes());
if (q.has('t') || EMBED) { $('start').classList.add('off'); if (q.get('autoplay') === '1' || (EMBED && q.get('autoplay') !== '0')) play(true); }
requestAnimationFrame(loop);
</script>
