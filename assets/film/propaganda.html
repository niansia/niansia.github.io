const S = D.stats, ratio = (D.outlets[0].total / D.outlets.slice(1).reduce((a, o) => a + o.total, 0) * (D.outlets.length - 1)).toFixed(1);
const T = {

const TW2CN = '個个偵侦傳传動动圖图場场學学專专層层屬属彙汇後后掃扫擴扩數数斷断於于時时暫暂標标樣样測测為为烏乌爾尔現现畫画種种筆笔節节約约紋纹級级結结經经網网緒绪總总聞闻與与號号裡里註注詞词語语調调過过開开關关隨随題题類类體体'; // Traditional → Simplified pairs for every character used above (generated with OpenCC)
const cnMap = {}; for (let i = 0; i < TW2CN.length; i += 2) cnMap[TW2CN[i]] = TW2CN[i + 1];
T['zh-CN'] = JSON.parse(JSON.stringify(T['zh-TW']).replace(/[一-鿿]/g, ch => cnMap[ch] || ch));
let C = T[L];

/* ---------- canvas & layout ---------- */
let W = 0, H = 0, DPR = 1, TXT = {};
function resize() {
  DPR = Math.min(1.75, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);

const unit = () => Math.min(W / 720, H * 1.6 / 1000); // layout unit: ~1px on a 1000px-wide stage, larger on phones

/* ---------- text → particle targets ---------- */
const NP = 2600;
function wrap(c, text, maxW) {

  const parts = cjk ? [...text] : text.split(/(\s+)/);
  const lines = []; let line = '';
  for (const p of parts) { const tryLine = line + p; if (c.measureText(tryLine).width > maxW && line.trim()) { lines.push(line.trim()); line = p.trimStart(); } else line = tryLine; }
  if (line.trim()) lines.push(line.trim());

}
function sample(text, size, font, rtl, maxLines = 3, cy = .42) {
  const oc = document.createElement('canvas'); oc.width = Math.ceil(W); oc.height = Math.ceil(H);
  const c = oc.getContext('2d'); c.fillStyle = '#fff'; c.textAlign = 'center'; c.textBaseline = 'middle';
  if (rtl) c.direction = 'rtl';
  let fs = size, lines;
  for (;;) { c.font = `700 ${fs}px ${font}`; lines = wrap(c, text, W * .84); if (lines.length <= maxLines || fs < 14) break; fs *= .9; }
  const lh = fs * 1.25, y0 = H * cy - (lines.length - 1) * lh / 2;
  lines.forEach((ln, i) => c.fillText(ln, W / 2, y0 + i * lh));
  const img = c.getImageData(0, 0, oc.width, oc.height).data, pts = [], step = Math.max(2, Math.round(fs / 16));
  for (let y = 0; y < oc.height; y += step) for (let x = 0; x < oc.width; x += step) if (img[(y * oc.width + x) * 4 + 3] > 140) pts.push([x, y]);
  const r = rng(7), out = [];
  if (!pts.length) return Array.from({length: NP}, () => [W / 2, H / 2]);
  for (let i = pts.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [pts[i], pts[j]] = [pts[j], pts[i]]; }
  for (let i = 0; i < NP; i++) out.push(pts[i % pts.length]);

}
let SEED = [];
function buildParticles() {
  const u = unit(), ex = D.examples[3], cjkFont = L === 'en' ? LAT : CJK;
  const r = rng(3);
  SEED = Array.from({length: NP}, () => ({x: r() * W, y: r() * H, a: r() * Math.PI * 2, s: .4 + r() * .9, hue: r()}));
  TXT = {
    word: sample(C.word, 150 * u, cjkFont, false, 1),
    title: sample(C.title, 58 * u, cjkFont, false, 2, .4),
    en: sample(ex.text, 46 * u, LAT, false), zh: sample(ex.zh, 50 * u, CJK, false),
    ar: sample(ex.ar, 50 * u, "'Segoe UI', 'Noto Naskh Arabic', Tahoma, sans-serif", true), ur: sample(ex.ur, 50 * u, "'Segoe UI', 'Noto Nastaliq Urdu', Tahoma, sans-serif", true),

function swarm(from, to, k, t, color = i => i % 3 ? PINK : VIOLET, jitter = 1) {

  for (let i = 0; i < NP; i++) {
    const a = from[i], b = to[i], s = SEED[i];

/* ---------- drawing helpers ---------- */
function crisp(text, size, cy, a, color, maxLines = 1) { // the real text, faded in once the particles settle

function glow(color, blur) { ctx.shadowColor = color; ctx.shadowBlur = blur; }

function label(text, x, y, {size = 13, color = MUTED, font = MONO, align = 'center', weight = 400} = {}) {
  ctx.font = `${weight} ${size * unit()}px ${font}`; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillText(text, x, y);

function chip(text, x, y, color, a = 1) {
  const u = unit(); ctx.font = `700 ${14 * u}px ${L === 'en' ? LAT : CJK}`;

/* ---------- scenes ---------- */
const TECH18 = [...D.techniques.map(t => ({...t})), {key: 'obf', en: 'Obfuscation', zh: '刻意模糊', zhcn: '刻意模糊', n: 8}];
const SCENES = [
  {dur: 8, draw(lt, p, t) { // intro: dust gathers into the word
    const k = ease(seg(lt, .6, 4.2)), out = seg(lt, 6.4, 8);

  {dur: 11, draw(lt, p, t) { // news flood tunnel

$('play').addEventListener('click', () => play());
$('replay').addEventListener('click', () => { seek(0); play(true); });
$('track').addEventListener('click', e => { const r = e.currentTarget.getBoundingClientRect(); seek((e.clientX - r.left) / r.width * TOTAL); });
$('lang').addEventListener('click', () => { L = {en: 'zh-TW', 'zh-TW': 'zh-CN', 'zh-CN': 'en'}[L]; applyLang(); });
$('snd').addEventListener('click', toggleSound);
$('fs').addEventListener('click', () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.());
addEventListener('keydown', e => {
  if (e.key === ' ') { e.preventDefault(); play(); }
  else if (e.key === 'ArrowRight') seek(time + 5); else if (e.key === 'ArrowLeft') seek(time - 5);
  else if (e.key.toLowerCase() === 'f') $('fs').click(); else if (e.key.toLowerCase() === 'r') { seek(0); play(true); }
});
addEventListener('pointermove', () => { document.body.classList.remove('idle'); clearTimeout(idleTimer); idleTimer = setTimeout(() => playing && document.body.classList.add('idle'), 2600); });
addEventListener('resize', () => { clearTimeout(resize.t); resize.t = setTimeout(resize, 150); });
window.__film = {seek, play, get time() { return time; }, TOTAL};

resize(); applyLang();
(document.fonts?.ready || Promise.resolve()).then(() => buildParticles());
if (q.get('clean') === '1') $('ui').style.display = 'none'; // for recording the teaser
if (q.has('t')) { $('start').classList.add('off'); if (q.get('autoplay') === '1') play(true); }
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
