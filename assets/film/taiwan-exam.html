/* ---------------- background: notebook ruling, margin line, petals ---------------- */
const bg = $('bg'), bgx = bg.getContext('2d'), fx = $('fx'), fxx = fx.getContext('2d');
const PET = Array.from({length: 42}, (_, i) => { const r = n => { const s = Math.sin(i * 127.1 + n * 311.7) * 43758.5453; return s - Math.floor(s); }; return {x: r(1), y: r(2), s: 8 + r(3) * 12, v: .04 + r(4) * .05, w: r(5) * 6.28, d: r(6)}; });
function drawBg(t) {
  const w = bg.width, h = bg.height, pr = w / innerWidth; bgx.clearRect(0, 0, w, h);
  const k = ss(t, .1, 1.6), gap = 38 * pr;
  bgx.strokeStyle = '#392f4612'; bgx.lineWidth = 1 * pr;
  for (let y = gap * 1.6, i = 0; y < h; y += gap, i++) { bgx.beginPath(); bgx.moveTo(0, y); bgx.lineTo(w * clamp(k * 1.4 - i * .02), y); bgx.stroke(); }
  bgx.strokeStyle = '#cc789355'; bgx.lineWidth = 2 * pr; bgx.beginPath(); bgx.moveTo(90 * pr, 0); bgx.lineTo(90 * pr, h * k); bgx.stroke();
  const g = bgx.createRadialGradient(w, 0, 0, w, 0, w * .6); g.addColorStop(0, '#e6d5df88'); g.addColorStop(1, '#e6d5df00'); bgx.fillStyle = g; bgx.fillRect(0, 0, w, h);
}
function drawFx(t) {
  const w = fx.width, h = fx.height, pr = w / innerWidth; fxx.clearRect(0, 0, w, h);
  const dens = .35 + .65 * Math.max(1 - seg(t, 1, 6), ss(t, 72.4, 75));
  PET.forEach((p, i) => { if (p.d > dens) return;
    const y = ((p.y + t * p.v) % 1.1 - .05) * h, x = ((p.x + Math.sin(t * .6 + p.w) * .03 - t * .012) % 1 + 1) % 1 * w, r = p.s * pr;
    fxx.save(); fxx.translate(x, y); fxx.rotate(t * .8 + p.w); fxx.scale(1, .6 + .4 * Math.sin(t * 2 + p.w));
    fxx.fillStyle = i % 3 ? '#f2c3d2cc' : '#e7a9bdcc'; fxx.beginPath(); fxx.moveTo(0, -r); fxx.bezierCurveTo(r, -r * .6, r * .7, r * .6, 0, r); fxx.bezierCurveTo(-r * .7, r * .6, -r, -r * .6, 0, -r); fxx.fill(); fxx.restore(); });
}

/* ---------------- frame ---------------- */
const TOTAL = 80;
function update(t) {
  ANIM.forEach(a => applyAnim(a, t)); HOOKS.forEach(f => f(t));
  const drift = Math.sin(t * .21) * 6; world.style.transform = `translate3d(${drift}px,${Math.cos(t * .17) * 4}px,0)`;
  drawBg(t); drawFx(t);
  const s = C.subs.find(([a, b]) => t >= a && t <= b); const sub = $('sub'); sub.classList.toggle('on', !!s); if (s) sub.textContent = s[2];
}

/* ---------------- playback ---------------- */
let time = clamp(Number(q.get('t')) || 0, 0, TOTAL), playing = false, last = 0, idleT;
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
const post = type => { if (EMBED) parent.postMessage({source: 'propaganda-film', type}, '*'); };
function paint() { $('fill').style.width = `${time / TOTAL * 100}%`; $('time').textContent = `${fmt(time)} / ${fmt(TOTAL)}`;
  $('play').innerHTML = playing ? '<svg viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>' : '<svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>'; }
function loop(ts) {
  const dt = last ? Math.min(.05, (ts - last) / 1000) : 0; last = ts;
  if (playing) { time += dt; if (time >= TOTAL) { time = TOTAL; playing = false; post('ended'); } }
  update(time); paint(); requestAnimationFrame(loop);
}
function play(on = !playing) { if (on && time >= TOTAL) time = 0; playing = on; last = 0; $('start').classList.add('off'); paint(); post(on ? 'play' : 'pause'); }
function seek(t) { time = clamp(t, 0, TOTAL); paint(); update(time); }
function resize() {
  const w = innerWidth, h = innerHeight, k = Math.min(w / 1600, h / 900), pr = Math.min(2, devicePixelRatio || 1);
  $('stage').style.transform = `translate(-50%,-50%) scale(${k})`;
  [bg, fx].forEach(c => { c.width = w * pr; c.height = h * pr; });
  update(time);
}
document.documentElement.lang = L === 'en' ? 'en' : L === 'zh-CN' ? 'zh-Hans' : 'zh-Hant';
$('brand-sub').textContent = C.brand; $('go-label').textContent = C.go; $('go-sub').textContent = C.goSub;
$('lang').textContent = {en: 'EN', 'zh-TW': '繁', 'zh-CN': '简'}[L];
$('back').href = `${L === 'en' ? '/' : L === 'zh-CN' ? '/zh-cn/' : '/zh-tw/'}#research`;
$('go').addEventListener('click', () => play(true)); $('play').addEventListener('click', () => play());
$('track').addEventListener('click', e => { const r = e.currentTarget.getBoundingClientRect(); seek((e.clientX - r.left) / r.width * TOTAL); });
$('lang').addEventListener('click', () => { const p = new URLSearchParams(q); p.set('lang', {en: 'zh-TW', 'zh-TW': 'zh-CN', 'zh-CN': 'en'}[L]); p.set('t', time.toFixed(1)); p.set('autoplay', playing ? '1' : '0'); location.replace(`?${p}`); });
$('fs').addEventListener('click', () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.());
document.addEventListener('click', e => { if (document.body.classList.contains('mini') && !e.target.closest('button,a')) play(); });
addEventListener('keydown', e => {
  if (e.key === ' ') { e.preventDefault(); play(); } else if (e.key === 'ArrowRight') seek(time + 5); else if (e.key === 'ArrowLeft') seek(time - 5);
  else if (e.key.toLowerCase() === 'f') $('fs').click(); else if (e.key.toLowerCase() === 'r') { seek(0); play(true); }
  else if (e.key === 'Escape' && EMBED) post('escape');
});
addEventListener('pointermove', () => { document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => playing && document.body.classList.add('idle'), 2400); });
addEventListener('resize', () => { clearTimeout(resize.t); resize.t = setTimeout(resize, 120); });
addEventListener('message', e => { const m = e.data; if (!m || m.source !== 'niansia-dock') return; if (m.type === 'mode') { document.body.classList.toggle('mini', !!m.mini); resize(); } if (m.type === 'play') play(true); if (m.type === 'pause') play(false); });
window.__film = {seek, play, get time() { return time; }, TOTAL};
if (EMBED) document.body.classList.add('embed');
if (CLEAN) { $('ui').style.display = 'none'; $('sub').style.display = 'none'; }
resize();
if (q.has('t') || EMBED) { $('start').classList.add('off'); if (q.get('autoplay') === '1' || (EMBED && q.get('autoplay') !== '0')) play(true); }
requestAnimationFrame(loop);
})();
