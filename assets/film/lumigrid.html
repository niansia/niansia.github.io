<style>

<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';

const $ = id => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const seg = (t, a, b) => clamp((t - a) / (b - a));

const q = new URLSearchParams(location.search), EMBED = q.get('embed') === '1', CLEAN = q.get('clean') === '1';
let L = q.get('lang') || (/^zh-(cn|sg)/i.test(navigator.language) ? 'zh-CN' : /^zh/i.test(navigator.language) ? 'zh-TW' : 'en');

const base = '/assets/lumigrid/';

const [META, SHOW, gImg, iImg] = await Promise.all([fetch(base + 'film/meta.json?v=2').then(r => r.json()), fetch(base + 'showcase.json?v=1').then(r => r.json()), loadImg(base + 'film/p_guide.png'), loadImg(base + 'film/p_in.png')]);

/* ---------------- short technical annotations (no chapters, no step numbers) ---------------- */
const pct = (META.dark_frac * 100).toFixed(0), ml = META.mean_lum.toFixed(3), sz = `${META.size[0]} × ${META.size[1]}`;
const psnr = TAB.lumigrid[1].toFixed(2), ssim = TAB.lumigrid[2].toFixed(3);
const EQ = '<i>I<sub>k</sub></i> = <i>I<sub>k−1</sub></i> + <i>α<sub>k</sub></i> <i>I<sub>k−1</sub></i>(1 − <i>I<sub>k−1</sub></i>), k = 1…8';

    apply: `${EQ}<small><i>Î<sub>g</sub></i> = <i>M</i> <i>I</i><sub>8</sub> + <i>b</i> · every pixel, full resolution</small>`,
    tiles: 'refiner <i>R</i>(<i>I</i>, <i>Î<sub>g</sub></i>) · NAFNet U-Net<small>1024² tiles · 64-px linear blend</small>',
    resid: 'residual |<i>R</i>| × 6<small>amplified noise removed, texture kept</small>',
    titleSub: `${psnr} dB · SSIM ${ssim} · 20 held-out NTIRE 2025 pairs`},
  'zh-TW': {sub: '處理過程視覺化', go: '播放', goSub: '約 90 秒 · 一張真實測試圖，從頭處理到尾', home: '返回',

    apply: `${EQ}<small><i>Î<sub>g</sub></i> = <i>M</i> <i>I</i><sub>8</sub> + <i>b</i> · 每個像素、全解析度</small>`,

    input: `输入 · ${sz} · 平均亮度 ${ml}`, gain: '显示增益 ×4 · 仅供可视化',

    grid: '<i>𝒢</i> ∈ ℝ<sup>16×16×8×36</sup><small>每格：8 条 LE 曲线 × RGB + 3×4 色彩矩阵</small>',
    guide: '<i>z</i> = <i>g</i>(<i>I</i>) · 逐像素学到的亮度坐标<small>高度已放大以便观察</small>',
    probe: '三线性查表 · 周围 8 个格子加权', curve: '这张图预测出的 LE 曲线',
    apply: `${EQ}<small><i>Î<sub>g</sub></i> = <i>M</i> <i>I</i><sub>8</sub> + <i>b</i> · 每个像素、全分辨率</small>`,
    tiles: '细修 <i>R</i>(<i>I</i>, <i>Î<sub>g</sub></i>) · NAFNet U-Net<small>1024² 图块 · 64 像素线性融合</small>',

    titleSub: `20 组保留的 NTIRE 2025 测试图 · ${psnr} dB · SSIM ${ssim}`},

const C = COPY[L];

/* ---------------- renderer ---------------- */
const canvas = $('gl');
const renderer = new THREE.WebGLRenderer({canvas, antialias: true});

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, 1, .1, 500);
const composer = new EffectComposer(renderer);

const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), .3, .35, .8); composer.addPass(bloom);

  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }',
  fragmentShader: `uniform sampler2D tDiffuse; uniform float uTime, uFade, uGrain; uniform vec2 uRes; varying vec2 vUv;

const loader = new THREE.TextureLoader();
const tex = (name, {mip = true, flip = false, color = true} = {}) => { const t = loader.load(base + name); if (color) t.colorSpace = THREE.SRGBColorSpace; t.flipY = flip; t.generateMipmaps = mip; t.minFilter = mip ? THREE.LinearMipmapLinearFilter : THREE.LinearFilter; t.anisotropy = 4; return t; };
const T = {pin: tex('film/p_in.png'), pbase: tex('film/p_base.png'), pout: tex('film/p_out.png'), pguide: tex('film/p_guide.png', {mip: false, color: false}), feats: tex('film/feats.png', {mip: false, color: false}),
  cbase: tex('0_crop_base.jpg', {mip: false, flip: true}), cout: tex('0_crop_out.jpg', {mip: false, flip: true}), hin: tex('0_in.jpg', {flip: true}), hout: tex('0_out.jpg', {flip: true})};
const vsUV = 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }';

/* ---------------- world: the image lies on the XZ plane; luminance and the learned guide lift it along +Y ---------------- */
const NX = 248, NY = 166, W = 30, H = W * NY / NX, GK = 9;   // GK: display height of the grid's luminance axis
const uv = new Float32Array(NX * NY * 2);
for (let j = 0; j < NY; j++) for (let i = 0; i < NX; i++) { uv[(j * NX + i) * 2] = (i + .5) / NX; uv[(j * NX + i) * 2 + 1] = (j + .5) / NY; }
const pgeo = new THREE.BufferGeometry(); pgeo.setAttribute('aUV', new THREE.BufferAttribute(uv, 2)); pgeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(NX * NY * 3), 3));
const U = {tIn: {value: T.pin}, tBase: {value: T.pbase}, tOut: {value: T.pout}, tGuide: {value: T.pguide}, W: {value: W}, H: {value: H},
  uReveal: {value: 0}, uSquare: {value: 0}, uMosaic: {value: 0}, uLiftLum: {value: 0}, uLiftGuide: {value: 0}, uGain: {value: 1}, uSweep: {value: -1}, uApply: {value: 0},
  uTiles: {value: 0}, uTileOn: {value: 0}, uSize: {value: W / NX}, uScale: {value: 1}, uOpacity: {value: 1}, uGK: {value: GK}, uLK: {value: 13}, uPulse: {value: 0}};
const pmat = new THREE.ShaderMaterial({glslVersion: THREE.GLSL3, uniforms: U, transparent: true,
  vertexShader: `in vec2 aUV; uniform sampler2D tIn, tBase, tOut, tGuide; uniform float W, H, uReveal, uSquare, uMosaic, uLiftLum, uLiftGuide, uGain, uSweep, uApply, uTiles, uTileOn, uSize, uScale, uOpacity, uGK, uLK, uPulse;
    out vec3 vCol; out float vA;
    void main(){
      bool mos = uMosaic >= 1.;
      vec2 uvm = mos ? (floor(aUV * uMosaic) + .5) / uMosaic : aUV;
      vec3 cin = textureLod(tIn, uvm, mos ? log2(248. / uMosaic) : 0.).rgb, cb = textureLod(tBase, aUV, 0.).rgb, co = textureLod(tOut, aUV, 0.).rgb;
      vec3 raw = textureLod(tIn, aUV, 0.).rgb;
      float g = textureLod(tGuide, aUV, 0.).r, lum = dot(raw, vec3(.2126,.7152,.0722));

      float swept = (1. - smoothstep(uSweep - .03, uSweep, aUV.x)) * uApply;
      float fall = (1. - smoothstep(uSweep - .16, uSweep - .01, aUV.x)) * uApply;
      float ti = floor(aUV.x * 3.) + floor(aUV.y * 2.) * 3.;
      float done = clamp(uTiles - ti, 0., 1.) * uTileOn;
      vec3 col = min(cin * uGain, vec3(1.));
      col = mix(col, cb, swept);
      col = mix(col, co, done);
      float front = exp(-pow((aUV.x - uSweep) * 45., 2.)) * uApply;
      col += vec3(.49,.77,1.) * front * .8;

// encoder activations: 4 stages × 4 channels, the real feature maps of this image
const feats = [];
const featMat = (i, c) => new THREE.ShaderMaterial({transparent: true, depthWrite: false, side: THREE.DoubleSide, uniforms: {t: {value: T.feats}, o: {value: new THREE.Vector2(c / 4, i / 4)}, uA: {value: 0}},
  vertexShader: vsUV,
  fragmentShader: `uniform sampler2D t; uniform vec2 o; uniform float uA; varying vec2 vUv;
    void main(){ float v = texture2D(t, o + vec2(vUv.x, 1. - vUv.y) * .25).r; vec3 c = mix(vec3(.02,.05,.09), vec3(.49,.77,1.), smoothstep(.1,.8,v)); c = mix(c, vec3(1.,.85,.6), smoothstep(.85,1.,v));

{ let x = H / 2 + 3;
  [.42, .34, .27, .21].forEach((k, i) => { const s = H * k;
    for (let c = 0; c < 4; c++) { const m = new THREE.Mesh(new THREE.PlaneGeometry(s, s), featMat(i, c)); m.rotation.x = -Math.PI / 2; m.position.set(x + s / 2, .5 + c * .8, -c * .5); m.renderOrder = 1; scene.add(m); feats.push({m, i, c, s}); }

const cells = new THREE.InstancedMesh(new THREE.BoxGeometry(W / 16 * .2, GK / 8 * .2, H / 16 * .2), new THREE.MeshBasicMaterial({transparent: true, opacity: 0, depthWrite: false}), 2048);

  for (let d = 0; d < 8; d++) for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) { const rgb = GRIDC[d][y][x]; c.setRGB(rgb[0] * .78, rgb[1] * .78, rgb[2] * .78, THREE.SRGBColorSpace); cells.setColorAt(k, c);
    cellInfo.push({p: V(((x + .5) / 16 - .5) * W, (d + .5) / 8 * GK, ((y + .5) / 16 - .5) * H), d, x, y}); k++; }
  cells.instanceColor.needsUpdate = true; }

  for (let i = 0; i <= 16; i++) { const x = (i / 16 - .5) * W; for (const j of [0, 16]) pts.push(V(x, 0, (j / 16 - .5) * H), V(x, GK, (j / 16 - .5) * H)); }

  const g = new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({color: 0x9fb4cc, transparent: true, opacity: 0, depthWrite: false})); scene.add(g); return g; })();

const readPix = (img, u, v) => { const c = document.createElement('canvas'); c.width = img.width; c.height = img.height; const g = c.getContext('2d'); g.drawImage(img, 0, 0); const d = g.getImageData(Math.floor(u * img.width), Math.floor(v * img.height), 1, 1).data; return [d[0] / 255, d[1] / 255, d[2] / 255]; };

/* ---------------- labels anchored in 3-D ---------------- */
const LABELS = [];

label(C.input, 1.4, 5.4, () => V(-W / 2, 0, -H / 2 - .5));

label(C.thumb, 16, 19.2, () => V(-H / 2, 0, -H / 2 - .5));
['128² × 32', '64² × 64', '32² × 128', '16² × 128'].forEach((s, i) => label(`conv ↓2 · ${s}`, 18.8 + i * 1.9, 27.4, () => { const f = feats[i * 4 + (i % 2 ? 0 : 3)]; return f.m.position.clone().add(V(-f.s / 2, .3, i % 2 ? f.s / 2 + 1.6 : -f.s / 2 - .2)); }));

/* ---------------- one continuous camera path ---------------- */
const P = probe.p, CP = cropPos;
const KEYS = [
  [0, V(0, 42, 1.4), V(0, 0, 0)], [5, V(0, 39, 1.6), V(0, 0, 0)], [9.5, V(4, 18, 25), V(0, 1.8, 0)], [14, V(-5, 16, 24), V(0, 1.8, 0)],
  [17.5, V(7, 30, 22), V(10, 0, 0)], [22.5, V(FEAT_MID - 4, 29, 25), V(FEAT_MID - 2, 1.5, 0)], [27, V(8, 26, 27), V(3, 2.5, 0)],
  [32, V(-14, 18, 24), V(0, 3.5, 0)], [37, V(-17, 13, 17), V(P.x * .5, P.y * .8, P.z * .5)], [42.5, V(P.x + 5, P.y + 3, P.z + 7), P.clone()],
  [46.5, V(P.x + 3, P.y + 6, P.z + 12), V(P.x * .4, 3, 0)], [51, V(-4, 17, 24), V(0, 2.5, 0)], [55.5, V(4, 22, 21), V(0, 1, 0)],

const TOTAL = 92;

/* ---------------- the whole process as a function of time ---------------- */

    const lw = l.el.offsetWidth; l.el.style.left = `${clamp((p.x * .5 + .5) * w, 10, w - lw - 10)}px`; l.el.style.top = `${clamp((-p.y * .5 + .5) * h, 70, h - 60)}px`; });
  if (pr > 0) { const p = probe.p.clone().project(camera); cv.style.left = `${clamp((p.x * .5 + .5) * w + 36, 10, w - cv.offsetWidth - 10)}px`; cv.style.top = `${clamp((-p.y * .5 + .5) * h + 20, 60, h - cv.offsetHeight - 60)}px`; }

function drawCurve(k) {

  g.fillStyle = '#0a0d12e6'; g.fillRect(0, 0, 190, 150); g.strokeStyle = '#ffffff26'; g.lineWidth = 1; g.strokeRect(.5, .5, 189, 149);
  const X = x => 20 + x * 158, Y = y => 130 - y * 104;
  g.strokeStyle = '#ffffff14'; for (let i = 0; i <= 4; i++) { g.beginPath(); g.moveTo(X(i / 4), Y(0)); g.lineTo(X(i / 4), Y(1)); g.moveTo(X(0), Y(i / 4)); g.lineTo(X(1), Y(i / 4)); g.stroke(); }

/* ---------------- playback ---------------- */
let time = clamp(Number(q.get('t')) || 0, 0, TOTAL), playing = false, last = 0, idleT;
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
const post = type => { if (EMBED) parent.postMessage({source: 'propaganda-film', type}, '*'); };
function paint() { $('fill').style.width = `${time / TOTAL * 100}%`; $('time').textContent = `${fmt(time)} / ${fmt(TOTAL)}`;
  $('play').innerHTML = playing ? '<svg viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>' : '<svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>'; }
function loop(ts) {

  if (playing) { time += dt; if (time >= TOTAL) { time = TOTAL; playing = false; post('ended'); } }

}

}
document.documentElement.lang = L === 'en' ? 'en' : L === 'zh-CN' ? 'zh-Hans' : 'zh-Hant';
$('sub').textContent = C.sub; $('go-label').textContent = C.go; $('go-sub').textContent = C.goSub; $('title-sub').textContent = C.titleSub;
$('lang').textContent = {en: 'EN', 'zh-TW': '繁', 'zh-CN': '简'}[L];
$('back').href = `${L === 'en' ? '/' : L === 'zh-CN' ? '/zh-cn/' : '/zh-tw/'}#projects/lumigrid`; $('back').title = C.home;
$('go').addEventListener('click', () => play(true)); $('play').addEventListener('click', () => play());
$('track').addEventListener('click', e => { const r = e.currentTarget.getBoundingClientRect(); seek((e.clientX - r.left) / r.width * TOTAL); });
$('lang').addEventListener('click', () => { const p = new URLSearchParams(q); p.set('lang', {en: 'zh-TW', 'zh-TW': 'zh-CN', 'zh-CN': 'en'}[L]); p.set('t', time.toFixed(1)); p.set('autoplay', playing ? '1' : '0'); location.replace(`?${p}`); });
$('fs').addEventListener('click', () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.());
canvas.addEventListener('click', () => { if (document.body.classList.contains('mini')) play(); });
addEventListener('keydown', e => {
  if (e.key === ' ') { e.preventDefault(); play(); } else if (e.key === 'ArrowRight') seek(time + 5); else if (e.key === 'ArrowLeft') seek(time - 5);
  else if (e.key.toLowerCase() === 'f') $('fs').click(); else if (e.key.toLowerCase() === 'r') { seek(0); play(true); }
  else if (e.key === 'Escape' && EMBED) post('escape');
});
addEventListener('pointermove', () => { document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => playing && document.body.classList.add('idle'), 2400); });
addEventListener('resize', () => { clearTimeout(resize.t); resize.t = setTimeout(resize, 120); });
addEventListener('message', e => { const m = e.data; if (!m || m.source !== 'niansia-dock') return; if (m.type === 'mode') { document.body.classList.toggle('mini', !!m.mini); resize(); } if (m.type === 'play') play(true); if (m.type === 'pause') play(false); });
window.__film = {seek, play, get time() { return time; }, TOTAL};
if (EMBED) document.body.classList.add('embed');
if (CLEAN) $('ui').style.display = 'none';
resize();
if (q.has('t') || EMBED) { $('start').classList.add('off'); if (q.get('autoplay') === '1' || (EMBED && q.get('autoplay') !== '0')) play(true); }
requestAnimationFrame(loop);
