/* ---------------- language & copy ---------------- */
const q = new URLSearchParams(location.search);

let L = q.get('lang') || (/^zh-(cn|sg)/i.test(navigator.language) ? 'zh-CN' : /^zh/i.test(navigator.language) ? 'zh-TW' : 'en');

const D = await (await fetch('/assets/lumigrid/showcase.json?v=1')).json();
const T = Object.fromEntries(D.table.map(r => [r[0], r]));
const P = k => T[k] ? T[k][1].toFixed(2) : '–';
const best = T['lumigrid+tta'] || T['lumigrid'];
const gain = (best[1] - T['original_pipeline'][1]).toFixed(1);
const fmt = v => v.toLocaleString('en');
const COPY = {

    chapters: ['Boot', 'Darkness', 'Thumbnail', 'Curve grid', 'Curves', 'Full-res slice', 'Refine', 'Results', 'End'],
    caps: [
      ['Giving the night back to the picture', 'LumiGrid: luminance-guided curve grids for low-light enhancement.'],

      ['See the whole scene first', 'The global branch reads only a 256×256 thumbnail, so it captures exposure and colour cast at a cost that does not grow with resolution.'],
      ['A 16×16×8 bilateral curve grid', 'Each cell holds 8 Zero-DCE curves and a 3×4 colour matrix; the cube colours are the transforms actually predicted for this image.'],

COPY['zh-CN'] = JSON.parse(JSON.stringify(COPY['zh-TW']).replace(/[一-鿿]/g, ch => TW2CN[ch] || ch));
let C = COPY[L];

/* ---------------- code panel, one snippet per chapter ---------------- */
const it0 = D.items[0];
const CODE = [
  `<span class="p">$</span> python scripts/enhance.py night.png --tta\n<span class="o">✓</span> weights  lumigrid.pth (${D.params_M} M params)\n<span class="o">✓</span> global   256² thumbnail → 16×16×8 curve grid\n<span class="o">✓</span> local    NAFNet, tiles 1024² / overlap 64`,
  `x = cv2.imread(<span class="s">"night.png"</span>)       <span class="c"># ${it0.size[0]}×${it0.size[1]}</span>\npsnr(gt, x)                     <span class="c"># ${it0.psnr.input.toFixed(2)} dB</span>\n<span class="c"># test-split mean for raw inputs: ${P('input')} dB</span>`,
  `thumb = cv2.resize(x, (<span class="o">256</span>, <span class="o">256</span>), cv2.INTER_AREA)\ngrid  = GlobalGrid()(thumb)\ngrid.shape                      <span class="c"># (1, 36, 8, 16, 16)</span>`,

  `g    = sigmoid(guide(pixel))     <span class="c"># learned luminance</span>\ncoef = grid_sample(grid, (x, y, g))   <span class="c"># trilinear</span>\nbase = apply(coef, pixel)       <span class="c"># full resolution</span>`,
  `out = base + NAFNet(x, base)    <span class="c"># residual</span>\n<span class="c"># 3-level U-Net, gated depthwise convs</span>\n<span class="c"># overlapping 1024² tiles, fp16</span>`,

/* ---------------- renderer, scene, post-processing ---------------- */
const canvas = $('gl');

  uniforms: {tDiffuse: {value: null}, uTime: {value: 0}, uGrain: {value: .045}, uGlitch: {value: 0}, uWipe: {value: -1}, uRes: {value: new THREE.Vector2(1, 1)}},

/* ---------------- helpers: text textures, lines ---------------- */
function textCanvas(text, {size = 64, font = MONO, weight = 600, color = '#fff', pad = 12, bg = null, dir = 'ltr', maxW = 0} = {}) {

  g.font = `${weight} ${size}px ${font}`; g.direction = dir;
  const w = Math.ceil(Math.min(maxW || 1e9, g.measureText(text).width) + pad * 2), h = Math.ceil(size * 1.35 + pad * 2);
  c.width = w; c.height = h; g.font = `${weight} ${size}px ${font}`; g.direction = dir; g.textBaseline = 'middle';
  if (bg) { g.fillStyle = bg; g.beginPath(); g.roundRect(0, 0, w, h, h / 2); g.fill(); }
  g.fillStyle = color; g.textAlign = dir === 'rtl' ? 'right' : 'left'; g.fillText(text, dir === 'rtl' ? w - pad : pad, h / 2 + 2);
  return c;
}
function textMesh(text, height, opts = {}) {
  const c = textCanvas(text, opts), tex = new THREE.CanvasTexture(c);

}

  lt => [V(Math.sin(lt * .2) * 8 - 3, 3 + Math.sin(lt * .3), 30 - lt * .5), V(0, 0, 0)],
  lt => [V(Math.sin(lt * .15) * 5, 2, 30 - lt * .5), V(0, 1, 0)],
  lt => { const a = lerp(-.45, .35, ease(seg(lt, 0, 12))); return [V(Math.sin(a) * 30, 12, Math.cos(a) * 28), V(0, 6, 0)]; },
  lt => [V(Math.sin(lt * .12) * 6, 3 + lt * .3, 34 - lt * .4), V(0, lt > 8 ? 6 : 0, 0)],
];
const pose = (i, t) => { const [a, b] = CAMS[i](clamp(t - START[i], 0, DUR[i])); return [a.add(ST[i]), b.add(ST[i])]; };
const presence = (i, t) => (i ? seg(t, START[i] - TR / 2, START[i] + TR / 2) : 1) * (i < 8 ? 1 - seg(t, START[i] + DUR[i] - TR / 2, START[i] + DUR[i] + TR / 2) : 1);
const boundary = t => { for (let i = 1; i < 9; i++) if (Math.abs(t - START[i]) < TR / 2) return i; return 0; };
const SHP_IN = ['word', 'img1', 'thumb', 'lattice', 'curves', 'img5', 'crops', 'bars', 'title'];
const SHP_OUT = ['word', 'img1', 'thumb', 'lattice', 'curves', 'img5', 'crops', 'bars', 'title'];
const DUST = [1, .06, .15, .08, .12, .05, .05, .1, .08];

function flyCamera(t) {
  const b = boundary(t);
  if (!b) { const cur = START.findLastIndex(x => x <= t); const [p, q2] = pose(cur, t); camera.position.copy(p); camera.up.set(0, 1, 0); camera.lookAt(q2); return; }
  const k = ease(seg(t, START[b] - TR / 2, START[b] + TR / 2));
  const [pa, qa] = pose(b - 1, t), [pb, qb] = pose(b, t);
  const p = pa.clone().lerp(pb, k), q2 = qa.clone().lerp(qb, k);
  p.y += bell(k) * pa.distanceTo(pb) * .12;
  camera.position.copy(p); camera.up.set(0, 1, 0); camera.lookAt(q2);
  camera.rotation.z += bell(k) * .07 * (b % 2 ? 1 : -1);
}
function flySwarm(t) {
  const b = boundary(t); let op, sc;
  if (b) { const k = ease(seg(t, START[b] - TR * .5, START[b] + TR * .5)); morph(SHP_OUT[b - 1], SHP_IN[b], k); op = Math.max(lerp(DUST[b - 1], DUST[b], k), .95 * bell(k)); sc = 3 + 16 * bell(k); }
  else {
    const cur = START.findLastIndex(x => x <= t), lt = t - START[cur];
    if (cur === 0) { morph('cloud', 'word', ease(seg(lt, 1.4, 5))); op = 1; sc = 10; }
    else if (cur === 8) { morph('crops', 'title', ease(seg(lt, 7.2, 10.5))); op = lerp(DUST[8], 1, seg(lt, 6.8, 8)); sc = 8; }
    else { morph(SHP_OUT[cur - 1] || 'cloud', SHP_IN[cur], 1); op = DUST[cur]; sc = 3; }
  }
  morphMat.uniforms.uOpacity.value = op; morphMat.uniforms.uScatter.value = sc;
}

const SC = [
  (lt, f, t) => {},
  (lt, f, t) => {
    setSweep(dark.img, 0, f);
    dark.bars.forEach((b, i) => { const g = easeOut(seg(lt, 1 + i * .05, 2.2 + i * .05)); b.scale.y = Math.max(.001, b.userData.h * g); b.position.y = -IH / 2 - 5 + b.userData.h * g / 2; setOpacity(b, f * (g > 0 ? 1 : 0)); });
    setOpacity(dark.lab, f * seg(lt, 1.5, 2.5)); setOpacity(dark.tag, f * seg(lt, .5, 1.5));
  },
  (lt, f, t) => {
    const k = ease(seg(lt, .5, 5)); cnn.thumb.position.set(lerp(-14, -6, k), Math.sin(lt * 1.5) * .3, 0); cnn.thumb.rotation.y = lerp(.4, -.3, k);
    setOpacity(cnn.thumb, f); setOpacity(cnn.tframe, f); setOpacity(cnn.tlab, f);
    cnn.slabs.forEach(({g, e}, i) => { const act = clamp((lt - 4 - i * .9) * 1.2); setOpacity(g, f * (.3 + .7 * easeOut(seg(lt, i * .2, 1 + i * .2)))); e.material.opacity = f * (.35 + .65 * act * (.6 + .4 * Math.sin(t * 6 - i))); });
    const o = easeOut(seg(lt, 7.5, 8.6)); cnn.orb.scale.setScalar(Math.max(.001, o * (1 + .08 * Math.sin(t * 4)))); setOpacity(cnn.orb, f * o); setOpacity(cnn.olab, f * o); setOpacity(cnn.clab, f * seg(lt, 1, 2));
    [cnn.tlab, cnn.olab, cnn.clab].forEach(m => m.lookAt(camera.position));
  },
  (lt, f, t) => {
    const m4 = new THREE.Matrix4(), sc = new THREE.Vector3(), qq = new THREE.Quaternion(), p = new THREE.Vector3();
    grid.meta.forEach((m, k) => { const g = easeOut(seg(lt, .2 + m[3] * .45 + (m[0] + m[2] + 15) * .012, 1 + m[3] * .45 + (m[0] + m[2] + 15) * .012)); sc.setScalar(Math.max(.001, g)); p.set(m[0], m[1] + (1 - g) * 4, m[2]); m4.compose(p, qq, sc); grid.mesh.setMatrixAt(k, m4); });
    grid.mesh.instanceMatrix.needsUpdate = true; grid.mesh.material.opacity = f; grid.mesh.visible = f > .002;
    setOpacity(grid.box, f * .6); [grid.l1, grid.l2, grid.l3].forEach((m, i) => { setOpacity(m, f * seg(lt, 3 + i * .5, 4 + i * .5)); m.lookAt(camera.position); });
  },
  (lt, f, t) => {
    curv.lines.forEach((ln, i) => { const k = ease(seg(lt, .8 + i * .5, 4 + i * .5)); ln.geometry.setDrawRange(0, Math.floor(161 * k)); setOpacity(ln, f); });
    curv.dots.forEach(({dot, pts}, i) => { const u = (t * .22 + i * .33) % 1, j = Math.min(31, Math.floor(u * 32)), fr = u * 32 - j; dot.position.copy(pts[j]).lerp(pts[j + 1], fr); setOpacity(dot, f * seg(lt, 4.5, 5.5)); });
    [curv.id, curv.lx, curv.ly, curv.eq].forEach(m => setOpacity(m, f * seg(lt, 0, 1.2)));
    G[4].children.filter(o => o.isLineSegments).forEach(o => setOpacity(o, f));
  },
  (lt, f, t) => { setSweep(slice.img, ease(seg(lt, 2, 9)), f); setOpacity(slice.lattice, f * (.4 + .6 * bell(seg(lt, 1.5, 9.5)))); slice.lattice.position.z = 3 - 2.5 * ease(seg(lt, 2, 9)); setOpacity(slice.tag, f * seg(lt, .5, 1.5)); },
  (lt, f, t) => { ref.panels.forEach((m, i) => { const e = easeOut(seg(lt, .4 + i * 2.2, 1.4 + i * 2.2)); setOpacity(m, f * e); m.position.y = (1 - e) * -3; }); ref.unet.rotation.y = t * .6; setOpacity(ref.unet, f * seg(lt, 5, 6)); },
  (lt, f, t) => {
    res.bars.forEach((b, i) => { const g = easeOut(seg(lt, .5 + i * .35, 2 + i * .35)); b.scale.y = Math.max(.001, b.userData.h * g); b.position.y = b.userData.h * g / 2; setOpacity(b, f * (g > 0 ? 1 : 0)); });
    res.labels.forEach((m, i) => { setOpacity(m, f * seg(lt, 1.5 + Math.floor(i / 2) * .35, 2.5 + Math.floor(i / 2) * .35)); m.lookAt(camera.position); });
    setOpacity(res.band, f * seg(lt, 5, 6)); setOpacity(res.blab, f * seg(lt, 5, 6)); res.blab.lookAt(camera.position);
  },
  (lt, f, t) => { gal.planes.forEach((m, i) => { setSweep(m, ease(seg(lt, .8 + i * 1.6, 3.8 + i * 1.6)), f * (1 - seg(lt, 6.5, 7.8))); }); },
];

let hudScene = 0;
function update(time) {
  flyCamera(time); flySwarm(time);
  G.forEach((g, i) => {
    const f = presence(i, time); g.visible = f > .001; if (!g.visible) return;
    const lt = time - START[i], pin = ease(seg(time, START[i] - TR / 2, START[i] + TR / 2)), pout = i < 8 ? ease(seg(time, START[i] + DUR[i] - TR / 2, START[i] + DUR[i] + TR / 2)) : 0;
    g.position.copy(ST[i]); if (ENTER[i] && i) g.position.add(V(...ENTER[i]).multiplyScalar(1 - pin));
    g.scale.setScalar(1 - pout * .12);
    const flick = pin < 1 && Math.sin(time * 90 + i) > .6 ? .55 : 1;
    SC[i](Math.min(lt, DUR[i]), f * flick, time);
  });
  floor.position.set(Math.round(camera.position.x / 6) * 6, -22, Math.round(camera.position.z / 6) * 6);
  const b = boundary(time), k = b ? seg(time, START[b] - TR / 2, START[b] + TR / 2) : 0;
  lens.uniforms.uGlitch.value = b ? Math.pow(bell(seg(time, START[b] - .45, START[b] + .45)), 2) : 0;
  lens.uniforms.uWipe.value = b && Math.abs(time - START[b]) < .45 ? 1 - seg(time, START[b] - .45, START[b] + .45) : -1;
  bloom.strength = .5 + .4 * bell(k);
  morphMat.uniforms.uTime.value = time;
  hudScene = START.findLastIndex(x => x <= time);
  if (codeFor !== hudScene) { codeFor = hudScene; typeCode(CODE[hudScene]); }
  setScene(hudScene);
}

/* ---------------- HUD: captions, code typing, language tag ---------------- */
let shown = -1, codeFor = -1, typeTimer;
function setScene(i) {
  if (i === shown) return; shown = i;
  const cap = $('cap'); cap.classList.add('on');
  decode($('cap-k'), `// ${String(i + 1).padStart(2, '0')} · ${C.chapters[i]}`, 380);
  decode($('cap-h'), C.caps[i][0], 700); decode($('cap-p'), C.caps[i][1], 900);
  $('chap').textContent = `ch.${String(i + 1).padStart(2, '0')}/09 · ${C.chapters[i]}`;
  chime(i);
}
const GLYPHS = '01<>/\\{}[]#$%&*+=?~ABCDEFXYZ▓▒░';
function decode(el, text, ms) { // characters resolve left to right out of glyph noise
  const t0 = performance.now(), chars = [...text]; cancelAnimationFrame(el._raf);
  const tick = now => { const k = clamp((now - t0) / ms), n = Math.floor(k * chars.length);
    el.textContent = chars.map((c, j) => j < n || c === ' ' ? c : GLYPHS[(Math.random() * GLYPHS.length) | 0]).join('');
    if (k < 1) el._raf = requestAnimationFrame(tick); };
  el._raf = requestAnimationFrame(tick);
}
function typeCode(html) {
  clearInterval(typeTimer);
  const el = $('code'), hdr = '<div class="hdr"><i></i><i></i><i></i><span>~/LumiGrid</span></div>';
  const total = (() => { const t = document.createElement('div'); t.innerHTML = html; return t.textContent.length; })();
  const render = k => { let left = k; const walk = node => { if (node.nodeType === 3) { if (left <= 0) { node.textContent = ''; return; } if (node.textContent.length > left) node.textContent = node.textContent.slice(0, left); left -= node.textContent.length; } else [...node.childNodes].forEach(walk); };
    const c = document.createElement('div'); c.innerHTML = html; walk(c); el.innerHTML = hdr + c.innerHTML + '<span class="cur"></span>'; };
  if (!playing) { render(total); return; }
  let n = 0; typeTimer = setInterval(() => { n += 3; render(n); if (n >= total) clearInterval(typeTimer); }, 16);
}
let langShown, langEl;
function langHud(lg) {
  if (lg === langShown) return; langShown = lg;
  if (!langEl) { langEl = document.createElement('div'); langEl.className = 'hud'; langEl.style.cssText = 'left:50%;top:17%;transform:translateX(-50%);font-size:12px;letter-spacing:.2em;color:#4fe3ff;text-align:center'; $('ui').append(langEl); }
  const names = {en: 'EN · English', zh: 'ZH · 中文', ar: 'AR · العربية', ur: 'UR · اردو', ps: 'PS · پښتو'};
  langEl.textContent = lg ? `lang = ${names[lg]}` : '';
}

/* ---------------- playback ---------------- */
let time = clamp(Number(q.get('t')) || 0, 0, TOTAL), playing = false, last = 0, fpsAcc = 0, fpsN = 0, fps = 0, idleT;
const tstr = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${(s % 60).toFixed(1).padStart(4, '0')}`;
function paintBar() {
  $('fill').style.width = `${time / TOTAL * 100}%`;
  $('time').textContent = `${tstr(time).slice(0, 5)} / ${tstr(TOTAL).slice(0, 5)}`;
  $('play').innerHTML = playing ? '<svg viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>' : '<svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>';
  $('end').classList.toggle('on', time >= TOTAL - .05);
}
function loop(ts) {
  const dt = last ? Math.min(.05, (ts - last) / 1000) : 0; last = ts;
  if (playing) { time += dt; if (time >= TOTAL) { time = TOTAL; playing = false; post('ended'); } }
  if (dt) { fpsAcc += dt; fpsN++; if (fpsAcc > .5) { fps = Math.round(fpsN / fpsAcc); fpsAcc = fpsN = 0; } }
  update(time);
  lens.uniforms.uTime.value = ts / 1000;
  composer.render();
  $('meta').textContent = `fps ${fps || '--'} · t=${tstr(time)} · webgl`;
  paintBar();
  requestAnimationFrame(loop);
}
function play(on = !playing) { if (on && time >= TOTAL) time = 0; playing = on; last = 0; $('start').classList.add('off'); if (on) startAudio(); codeFor = -1; paintBar(); post(on ? 'play' : 'pause'); }
function seek(t) { time = clamp(t, 0, TOTAL); codeFor = -1; paintBar(); }
const post = type => { if (EMBED) parent.postMessage({source: 'propaganda-film', type}, '*'); };

function resize() {
  const w = innerWidth, h = innerHeight, pr = Math.min(document.body.classList.contains('mini') ? 1 : 1.5, devicePixelRatio || 1);
  renderer.setPixelRatio(pr); renderer.setSize(w, h, false); composer.setPixelRatio(pr); composer.setSize(w, h);
  bloom.setSize(w * pr / 2, h * pr / 2); lens.uniforms.uRes.value.set(w * pr, h * pr);
  camera.aspect = w / h; camera.fov = w / h < 1 ? 74 : 50; camera.updateProjectionMatrix();
  morphMat.uniforms.uPR.value = pr * Math.min(1.6, h / 700);
}

/* ---------------- optional generated ambient sound ---------------- */
let AC = null, master = null, soundOn = false;
function startAudio() {
  if (!soundOn || AC) return;
  AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = 0; master.connect(AC.destination);
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 700; lp.Q.value = 4; lp.connect(master);
  [55, 82.4, 110, 164.8, 220].forEach((fr, i) => { const o = AC.createOscillator(), g = AC.createGain(); o.type = i < 2 ? 'sawtooth' : 'sine'; o.frequency.value = fr; o.detune.value = (i - 2) * 7; g.gain.value = i < 2 ? .025 : .05; o.connect(g); g.connect(lp); o.start(); });
  const lfo = AC.createOscillator(), lg = AC.createGain(); lfo.frequency.value = .06; lg.gain.value = 450; lfo.connect(lg); lg.connect(lp.frequency); lfo.start();
  master.gain.linearRampToValueAtTime(.4, AC.currentTime + 2.5);
}
function chime(i) {
  if (!AC || !soundOn) return;
  const t0 = AC.currentTime;
  [0, .09].forEach((d, k) => { const o = AC.createOscillator(), g = AC.createGain(); o.type = 'triangle'; o.frequency.value = [659, 784, 880, 988, 1047, 1175, 1319, 1480, 1568][i] * (k ? 1.5 : 1);
    g.gain.setValueAtTime(0, t0 + d); g.gain.linearRampToValueAtTime(.08, t0 + d + .01); g.gain.exponentialRampToValueAtTime(.0001, t0 + d + 1.2); o.connect(g); g.connect(master); o.start(t0 + d); o.stop(t0 + d + 1.3); });
}
function toggleSound() {
  soundOn = !soundOn; $('snd').textContent = C.snd[soundOn ? 1 : 0];
  if (soundOn) { if (!AC) startAudio(); else { AC.resume(); master.gain.linearRampToValueAtTime(.4, AC.currentTime + .5); } }
  else if (AC) master.gain.linearRampToValueAtTime(0, AC.currentTime + .4);
}

/* ---------------- UI ---------------- */
function applyLang() {
  C = COPY[L]; document.documentElement.lang = L === 'en' ? 'en' : L === 'zh-CN' ? 'zh-Hans' : 'zh-Hant';
  const base = L === 'en' ? '/' : L === 'zh-CN' ? '/zh-cn/' : '/zh-tw/';
  $('back').href = $('home').href = `${base}#research`; $('home').textContent = C.home;
  $('go-label').textContent = C.go; $('go-sub').textContent = C.goSub; $('snd').textContent = C.snd[soundOn ? 1 : 0];
  $('lang').textContent = {en: 'EN', 'zh-TW': '繁', 'zh-CN': '简'}[L];
  $('track').querySelectorAll('.tick').forEach(e => e.remove());
  START.forEach((s, i) => { if (!i) return; const tk = document.createElement('div'); tk.className = 'tick'; tk.style.left = `${s / TOTAL * 100}%`; tk.innerHTML = `<span>${C.chapters[i]}</span>`; tk.addEventListener('click', e => { e.stopPropagation(); seek(s + .01); }); $('track').append(tk); });
  shown = -1; codeFor = -1;
}
$('go').addEventListener('click', () => play(true));
$('play').addEventListener('click', () => play());
$('replay').addEventListener('click', () => { seek(0); play(true); });
$('track').addEventListener('click', e => { const r = e.currentTarget.getBoundingClientRect(); seek((e.clientX - r.left) / r.width * TOTAL); });
$('lang').addEventListener('click', () => { const next = {en: 'zh-TW', 'zh-TW': 'zh-CN', 'zh-CN': 'en'}[L]; const p = new URLSearchParams(q); p.set('lang', next); p.set('t', time.toFixed(1)); p.set('autoplay', playing ? '1' : '0'); location.replace(`?${p}`); });
$('snd').addEventListener('click', toggleSound);
$('fs').addEventListener('click', () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.());
canvas.addEventListener('click', () => { if (document.body.classList.contains('mini')) play(); });
addEventListener('keydown', e => {
  if (e.key === ' ') { e.preventDefault(); play(); }
  else if (e.key === 'ArrowRight') seek(time + 5); else if (e.key === 'ArrowLeft') seek(time - 5);
  else if (e.key.toLowerCase() === 'f') $('fs').click(); else if (e.key.toLowerCase() === 'r') { seek(0); play(true); }
  else if (e.key === 'Escape' && EMBED) parent.postMessage({source: 'propaganda-film', type: 'escape'}, '*');
});
addEventListener('pointermove', () => { document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => playing && document.body.classList.add('idle'), 2600); });
addEventListener('resize', () => { clearTimeout(resize.t); resize.t = setTimeout(resize, 120); });
addEventListener('message', e => { const m = e.data; if (!m || m.source !== 'niansia-dock') return; if (m.type === 'mode') { document.body.classList.toggle('mini', !!m.mini); resize(); } if (m.type === 'play') play(true); if (m.type === 'pause') play(false); });
window.__film = {seek, play, get time() { return time; }, TOTAL};

if (EMBED) document.body.classList.add('embed');
if (q.get('clean') === '1') { $('ui').style.display = 'none'; lens.uniforms.uGrain.value = 0; } // recording mode
resize(); applyLang(); buildShapes();
(document.fonts?.ready || Promise.resolve()).then(() => buildShapes());
if (q.has('t') || EMBED) { $('start').classList.add('off'); if (q.get('autoplay') === '1' || (EMBED && q.get('autoplay') !== '0')) play(true); }
requestAnimationFrame(loop);
</script>
