import * as THREE from 'three';

  document.fonts.load('600 26px "JetBrains Mono"').catch(() => {}), document.fonts.load('500 19px "JetBrains Mono"').catch(() => {})]);
const SIG = S.g3.signature.slice(0, 12) + '…', N = F.nodes.length, FIRST = S.g3.fails[0], COMMIT = S.source.commit.slice(0, 7);

/* ---------------- copy ---------------- */

    titleSub: '确定 · 可重放 · 可独立验证', titleNote: `片中的证据全部是模拟结果 · commit ${COMMIT}`},

const C = COPY[L];

/* ---------------- renderer ---------------- */
const canvas = $('gl');
const renderer = new THREE.WebGLRenderer({canvas, antialias: true});
renderer.setClearColor(0x000000, 1);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, 1, .1, 800);
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), .55, .4, .82); composer.addPass(bloom);
const lens = new ShaderPass({uniforms: {tDiffuse: {value: null}, uTime: {value: 0}, uRes: {value: new THREE.Vector2(1, 1)}, uFade: {value: 1}, uGrain: {value: CLEAN ? 0 : .035}},
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }',
  fragmentShader: `uniform sampler2D tDiffuse; uniform float uTime, uFade, uGrain; uniform vec2 uRes; varying vec2 vUv;
    float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233))) * 43758.5453); }
    void main(){ vec3 c = texture2D(tDiffuse, vUv).rgb; vec2 d = vUv - .5; c *= 1. - dot(d,d) * .6; c += (h(vUv * uRes + fract(uTime) * 57.) - .5) * uGrain; gl_FragColor = vec4(c * uFade, 1.); }`});
composer.addPass(new OutputPass()); composer.addPass(lens);

const col = (hex, k = 1) => new THREE.Color(hex).multiplyScalar(k);
const BLUE = '#7cc4ff', AMBER = '#ffb454', RED = '#ff5d6c', GREEN = '#4ade80', GREY = '#5b6472';

/* ---------------- text cards (sprites), ASCII only so they need no CJK font ---------------- */
function fit(g, s, x, y, max) { while (g.measureText(s).width > max && s.length > 3) s = s.slice(0, -2) + '…'; g.fillText(s, x, y); }
function cardTex(title, sub = '', {w = 380, accent = BLUE, border = '#ffffff2e', idx = '', color = '#dfe4ea', tall = false} = {}) {
  const h = sub || tall ? 104 : 70, c = document.createElement('canvas'); c.width = w * 2; c.height = h * 2;
  const g = c.getContext('2d'); g.scale(2, 2);

}
const setTex = (s, tex) => { s.material.map = tex.t; s.scale.set(s.userData.h * tex.a, s.userData.h, 1); };

/* ---------------- ground ---------------- */
{ const g = new THREE.GridHelper(420, 140, 0x9fb4cc, 0x9fb4cc); g.material.transparent = true; g.material.opacity = .045; g.position.set(90, -.6, 0); scene.add(g); }

/* ---------------- 1 · Case IR: the recorded 14-operation trigger as cards ---------------- */
const opTex = M.original.map((o, i) => cardTex(o.op, o.f, {idx: String(i + 1).padStart(2, '0'), tall: true}));
const introCards = M.original.map((o, i) => sprite(opTex[i], .8, V((i % 7 - 3) * 3.4, 7.6 - Math.floor(i / 7) * 1.25, 0)));

/* ---------------- 2 · discovery: G3's real mutation lineage, one node per execution ---------------- */
const R = 15, DMAX = Math.max(...F.nodes.map(n => n[6]));
const npos = F.nodes.map(n => { const a = n[5] * Math.PI * 2, r = n[6] / DMAX * R; return V(Math.cos(a) * r, n[6] * .12, Math.sin(a) * r); });
const tExec = e => 9 + (e - 1) / (N - 1) * 17;   // execution e (1-based) appears at this time
const ncol = F.nodes.map((n, i) => i === 0 ? col('#ffffff', 1.6) : n[4] ? col(RED, 2.4) : n[3] ? col(BLUE, .8 + .25 * n[2]) : col(GREY, .9));
const nsize = F.nodes.map((n, i) => i === 0 ? .55 : n[4] ? .34 : n[3] ? .17 + .05 * n[2] : .11);
const nodes = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1, 2), new THREE.MeshBasicMaterial({transparent: true}), N);

const edges = (() => { const p = [], c = [];
  F.nodes.forEach((n, i) => { if (!n[0]) return; const a = npos[n[0] - 1], b = npos[i], k = ncol[i].clone().multiplyScalar(n[4] ? .5 : .32);
    p.push(a.x, a.y, a.z, b.x, b.y, b.z); c.push(k.r, k.g, k.b, k.r, k.g, k.b); });

document.documentElement.lang = L === 'en' ? 'en' : L === 'zh-CN' ? 'zh-Hans' : 'zh-Hant';
$('sub').textContent = C.sub; $('go-label').textContent = C.go; $('go-sub').textContent = C.goSub; $('title-sub').textContent = C.titleSub; $('title-note').textContent = C.titleNote;
$('l-exec').textContent = C.exec; $('l-cov').textContent = C.cov; $('l-corp').textContent = C.corp; $('l-fail').textContent = C.fail;
$('lang').textContent = {en: 'EN', 'zh-TW': '繁', 'zh-CN': '简'}[L];
$('back').href = `${L === 'en' ? '/' : L === 'zh-CN' ? '/zh-cn/' : '/zh-tw/'}#projects/kcrashlab`; $('back').title = C.home;
$('go').addEventListener('click', () => play(true)); $('play').addEventListener('click', () => play());
$('track').addEventListener('click', e => { const r = e.currentTarget.getBoundingClientRect(); seek((e.clientX - r.left) / r.width * TOTAL); });
$('lang').addEventListener('click', () => { const p = new URLSearchParams(q); p.set('lang', {en: 'zh-TW', 'zh-TW': 'zh-CN', 'zh-CN': 'en'}[L]); p.set('t', time.toFixed(1)); p.set('autoplay', playing ? '1' : '0'); location.replace(`?${p}`); });
$('fs').addEventListener('click', () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.());
canvas.addEventListener('click', () => { if (document.body.classList.contains('mini')) play(); });
addEventListener('keydown', e => {
  if (e.key === ' ') { e.preventDefault(); play(); } else if (e.key === 'ArrowRight') seek(time + 5); else if (e.key === 'ArrowLeft') seek(time - 5);
  else if (e.key.toLowerCase() === 'f') $('fs').click(); else if (e.key.toLowerCase() === 'r') { seek(0); play(true); }
  else if (e.key === 'Escape' && EMBED) post('escape');
});
addEventListener('pointermove', () => { document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => playing && document.body.classList.add('idle'), 2400); });
addEventListener('resize', () => { clearTimeout(resize.t); resize.t = setTimeout(resize, 120); });
addEventListener('message', e => { const m = e.data; if (!m || m.source !== 'niansia-dock') return; if (m.type === 'mode') { document.body.classList.toggle('mini', !!m.mini); resize(); } if (m.type === 'play') play(true); if (m.type === 'pause') play(false); });
window.__film = {seek, play, get time() { return time; }, TOTAL, render() { update(time); composer.render(); }};
if (EMBED) document.body.classList.add('embed');
if (CLEAN) $('ui').style.display = 'none';
resize();
if (q.has('t') || EMBED) { $('start').classList.add('off'); if (q.get('autoplay') === '1' || (EMBED && q.get('autoplay') !== '0')) play(true); }
requestAnimationFrame(loop);
</script>
