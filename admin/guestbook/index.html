<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://www.gstatic.com https://apis.google.com; connect-src https://*.googleapis.com https://*.firebasedatabase.app wss://*.firebasedatabase.app; frame-src https://niansia-site.firebaseapp.com https://*.firebasedatabase.app https://accounts.google.com; img-src 'self' data: https://*.googleusercontent.com; style-src 'self'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>留言審核 · Niansia</title>
<link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<main>
  <header class="top">
    <h1>留言審核</h1>
    <div class="who"><span id="who">未登入</span><button id="sign" type="button">用 Google 登入</button></div>
  </header>
  <p id="note" class="note">只有網站擁有者的帳號能讀取待審留言；其他人登入也只會看到權限不足。</p>
  <section id="panel" hidden>
    <div class="bar"><h2>待審核 <b id="pending-n">0</b></h2><button id="clear" type="button" class="danger">全部刪除</button></div>
    <div id="pending" class="list"></div>
    <div class="bar"><h2>已公開 <b id="approved-n">0</b></h2></div>
    <div id="approved" class="list"></div>
  </section>
</main>
<script type="module" src="admin.js"></script>
</body>
</html>
